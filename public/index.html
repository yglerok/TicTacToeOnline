<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Welcome to Tic-Tac-Toe server!</h1>
        <p>Try <a href='/hi'>/hi</a> for a text message.</p>
        <input type="text" id="text-to-send">
        <button id="btn">Click!</button>
        <input type="number" min="0" max="8" step="1" value="0" id="move-indx">
        <button id="wsbtn">WS!</button>
    </header>


    <br><br>

    <main class="main-part">
        <aside class="info-panel">
            <div class="players" id="playersToggle">
                <div class="player you active" id="youPanel">
                    <!-- <span class="dot on" id="youDot"></span> -->
                    <span class="sym" id="youSymbol">X</span>
                    You
                </div>
                <div class="player opponent waiting" id="opponentPanel">
                    <!-- <span class="dot off" id="opponentDot"></span> -->
                    <span class="sym" id="opponentSymbol"></span>
                    <span id="opponentLabel">Waiting...</span>
                </div>
            </div>

            <div class="banner" id="resultBanner" hidden></div>
        </aside>

        <section class="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </section>
    </main>


    <script src="script.js"></script>
</body>

</html>
